services:
  db:
    image: postgres:16-alpine
    container_name: course_mgmt_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: course_management
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret123
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./src/sql/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql
      - ./src/sql/002_views.sql:/docker-entrypoint-initdb.d/002_views.sql
      - ./src/sql/003_functions.sql:/docker-entrypoint-initdb.d/003_functions.sql
      - ./src/sql/004_procedures.sql:/docker-entrypoint-initdb.d/004_procedures.sql
      - ./src/sql/005_triggers.sql:/docker-entrypoint-initdb.d/005_triggers.sql
      - ./src/sql/006_indexes.sql:/docker-entrypoint-initdb.d/006_indexes.sql
      - ./src/sql/007_seed.sql:/docker-entrypoint-initdb.d/007_seed.sql

volumes:
  pgdata:
